<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard รายการ Order - OPD PED</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 text-slate-800 flex flex-col justify-between">

  <div class="max-w-md mx-auto w-full bg-white rounded-xl shadow-lg overflow-hidden p-5">
    
    <!-- Header + ปุ่มสลับกลับหน้าส่ง Order -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
      <div>
        <h1 class="text-xl font-bold text-blue-600">📊 รายการ Order ที่ส่งแล้ว</h1>
        <p class="text-xs text-slate-500 mt-0.5">ตรวจสอบรายการประจำวัน</p>
      </div>
      <a href="index.html" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-semibold border border-blue-200 transition">
        ➕ ส่ง Order
      </a>
    </div>

    <!-- ส่วนเลือกวันที่ -->
    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-1">📅 เลือกวันที่ต้องการเช็กข้อมูล:</label>
      <input type="date" id="datePicker" onchange="fetchOrders()" 
             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- สรุปยอดรวมประจำวัน -->
    <div class="bg-blue-600 text-white rounded-xl p-3.5 mb-4 shadow-sm flex justify-between items-center">
      <div>
        <p class="text-xs opacity-80">ยอดรวมวันที่เลือก</p>
        <p id="totalCount" class="text-2xl font-bold">0 เคส</p>
      </div>
      <button onclick="fetchOrders()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-2.5 py-1.5 rounded-lg transition">
        🔄 รีเฟรช
      </button>
    </div>

    <!-- รายการตาราง/การ์ดแสดงผล -->
    <div id="loadingState" class="text-center py-8 text-slate-400 font-semibold animate-pulse text-sm">
      ⏳ กำลังโหลดข้อมูล...
    </div>

    <div id="orderListContainer" class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1">
      <!-- ข้อมูลรายการจะถูกดึงมาใส่ตรงนี้ด้วย JS -->
    </div>

    <div id="emptyState" class="hidden text-center py-8 text-slate-400 text-sm">
      📭 ไม่พบรายการ Order ในวันที่เลือก
    </div>

  </div>

  <!-- Footer ด้านล่างสุด -->
  <footer class="text-center text-[11px] text-slate-400 mt-6 mb-2 leading-relaxed">
    <p>พัฒนาโดยงานผลิตยา ฝ่ายเภสัชกรรม</p>
    <p>โรงพยาบาลศรีนครินทร์ คณะแพทยศาสตร์ มหาวิทยาลัยขอนแก่น</p>
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxCoO9dQ6h9d8zheRs3L_Y_EelrjnHR8u6DNCjmW-TbWnRtkkOYGdN3P99uJBfdKfnD_Q/exec";

    // ตั้งค่า Default วันที่ให้เป็น "วันนี้"
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('datePicker').value = today;
      fetchOrders();
    };

    async function fetchOrders() {
      const dateVal = document.getElementById('datePicker').value;
      const loading = document.getElementById('loadingState');
      const empty = document.getElementById('emptyState');
      const container = document.getElementById('orderListContainer');
      const totalCount = document.getElementById('totalCount');

      if (!dateVal) return;

      loading.classList.remove('hidden');
      empty.classList.add('hidden');
      container.innerHTML = "";
      totalCount.innerText = "0 เคส";

      try {
        const response = await fetch(`${WEB_APP_URL}?action=getOrders&date=${dateVal}`);
        const result = await response.json();

        loading.classList.add('hidden');

        if (result.success && result.data && result.data.length > 0) {
          totalCount.innerText = `${result.data.length} เคส`;
          
          result.data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-1 shadow-sm hover:border-blue-300 transition";
            
            card.innerHTML = `
              <div class="flex justify-between items-center border-b border-slate-200 pb-1">
                <span class="font-bold text-blue-600">#${index + 1} | HN: ${item.hn || '-'}</span>
                <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">
                  Ward: ${item.ward || 'ไม่ระบุ'}
                </span>
              </div>
              <div class="pt-1">
                <p class="text-slate-800 font-semibold">👤 ${item.name || 'ไม่พบข้อมูลชื่อ'}</p>
                ${item.note ? `<p class="text-slate-500 text-[11px] mt-0.5">📝 หมายเหตุ: ${item.note}</p>` : ''}
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          empty.classList.remove('hidden');
        }

      } catch (error) {
        loading.classList.add('hidden');
        alert("ไม่สามารถดึงข้อมูลได้: " + error);
      }
    }
  </script>
</body>
</html>
