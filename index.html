<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่ง Order ใบสั่งยา - OPD PED</title>
  <!-- Tailwind CSS เพื่อการจัดแต่ง UI อย่างรวดเร็ว -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 Qrcode Library สำหรับสแกนบาร์โค้ด -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    #reader { width: 100%; display: none; }
    #reader video { border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600"> OPD PED Order Sender</h1>
      <p class="text-sm text-slate-500">ระบบถ่ายภาพและส่งใบสั่งยาเข้าห้องผลิตยา</p>
    </div>

    <form id="orderForm" onsubmit="handleSubmit(event)" class="space-y-5">
      
      <!-- 1. ส่วนบาร์โค้ด / เลข HN -->
      <div>
        <label class="block text-sm font-semibold mb-1">เลข HN คนไข้ <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <input type="text" id="hnInput" required placeholder="กรอก หรือ สแกน HN" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-lg">
          <button type="button" onclick="toggleScanner()" 
                  class="bg-blue-100 text-blue-700 px-3 py-2 rounded-lg font-semibold hover:bg-blue-200 transition flex items-center gap-1">
            📷 สแกน
          </button>
        </div>
        <!-- กล้องสแกนบาร์โค้ด -->
        <div id="reader" class="mt-2"></div>
      </div>

      <!-- 2. ส่วนถ่ายรูปใบสั่งยา -->
      <div>
        <label class="block text-sm font-semibold mb-1">ถ่ายรูปใบสั่งยา <span class="text-red-500">*</span></label>
        
        <!-- ปุ่มกดถ่ายรูป (บังคับเปิดกล้องหลังบนมือถือ) -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processImage(event)">
        
        <button type="button" onclick="document.getElementById('cameraInput').click()" 
                class="w-full py-3 px-4 border-2 border-dashed border-blue-400 bg-blue-50 text-blue-600 rounded-lg font-semibold hover:bg-blue-100 transition flex justify-center items-center gap-2">
          📸 เปิดกล้องถ่ายภาพใบยา
        </button>
      </div>

      <!-- Canvas ซ่อนไว้ใช้ประมวลผลรูปภาพ (B/W + Contrast Adjustment) -->
      <canvas id="processCanvas" class="hidden"></canvas>

      <!-- 3. ส่วนพรีวิวรูปภาพที่ผ่านการปรับแต่งแล้ว -->
      <div id="previewContainer" class="hidden">
        <label class="block text-sm font-semibold mb-1 text-slate-600">ตัวอย่างภาพที่สแกน (ปรับความชัดแล้ว):</label>
        <div class="relative rounded-lg overflow-hidden border border-slate-200 bg-slate-50">
          <img id="imagePreview" src="" alt="Order Preview" class="w-full h-auto object-contain max-h-80">
          <button type="button" onclick="clearImage()" class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full text-xs hover:bg-red-600">
            ✕ ยกเลิกรูป
          </button>
        </div>
      </div>

      <!-- 4. หมายเหตุเพิ่มเติม (ถ้ามี) -->
      <div>
        <label class="block text-sm font-semibold mb-1">หมายเหตุถึงเภสัชกร (ถ้ามี)</label>
        <textarea id="noteInput" rows="2" placeholder="เช่น STAT, ยาด่วน, เปลี่ยน dose..." 
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
      </div>

      <!-- 5. ปุ่มกดส่งข้อมูล -->
      <button type="submit" id="submitBtn" disabled 
              class="w-full bg-slate-300 text-slate-500 py-3 rounded-lg font-bold text-lg cursor-not-allowed transition">
        🚀 ส่ง Order เข้าห้องผลิตยา
      </button>

    </form>

    <!-- Message แสดงสถานะ -->
    <div id="statusMsg" class="mt-4 text-center font-semibold text-sm"></div>

  </div>

  <script>
    let html5QrcodeScanner = null;
    let processedBase64Image = "";

    // --- 1. ระบบสแกน Barcode / QR Code ---
    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      if (readerDiv.style.display === 'block') {
        stopScanner();
      } else {
        readerDiv.style.display = 'block';
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" }, 
          { fps: 10, qrbox: { width: 250, height: 150 } },
          (decodedText) => {
            document.getElementById('hnInput').value = decodedText;
            stopScanner();
          },
          (errorMessage) => { /* ซ่อน error log ย่อย */ }
        ).catch(err => {
          alert('ไม่สามารถเปิดกล้องได้: ' + err);
          stopScanner();
        });
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
        }).catch(() => {
          document.getElementById('reader').style.display = 'none';
        });
      }
    }

    // --- 2. ระบบดักจับภาพถ่าย & ปรับภาพให้สแกนชัด (Auto B/W Document Scanner Effect) ---
    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('processCanvas');
          const ctx = canvas.getContext('2d');

          // ย่อขนาดภาพไม่ให้ใหญ่เกินไป (Max Width 1600px) เพื่อประหยัดพื้นที่และโหลดเร็ว
          const maxWidth = 1600;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // ดึง Pixel Data มาทำ Grayscale + High Contrast (ปรับตัวอักษรลายมือให้ดำชัด 배경สว่าง)
          const imgData = ctx.getImageData(0, 0, width, height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            // คำนวณค่าความสว่าง Grayscale
            const avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            
            // ปรับ Thresholding (ถ้าสว่างเกินไปให้เป็นขาว ถ้ามืดให้ดึงเป็นดำเข้ม)
            let val = avg;
            if (val > 140) {
              val = Math.min(255, val * 1.15); // เร่งพื้นหลังให้ขาว
            } else {
              val = Math.max(0, val * 0.75);  // เร่งรอยหมึกปากกาให้ดำชัด
            }

            data[i] = val;     // Red
            data[i + 1] = val; // Green
            data[i + 2] = val; // Blue
          }

          ctx.putImageData(imgData, 0, 0);

          // แปลงเป็น Base64 Image (JPEG compression 0.85)
          processedBase64Image = canvas.toDataURL('image/jpeg', 0.85);

          // แสดง Preview
          document.getElementById('imagePreview').src = processedBase64Image;
          document.getElementById('previewContainer').classList.remove('hidden');
          
          // เปิดใช้งานปุ่มส่ง
          checkFormStatus();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      processedBase64Image = "";
      document.getElementById('cameraInput').value = "";
      document.getElementById('previewContainer').classList.add('hidden');
      checkFormStatus();
    }

    function checkFormStatus() {
      const submitBtn = document.getElementById('submitBtn');
      if (processedBase64Image !== "") {
        submitBtn.disabled = false;
        submitBtn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        submitBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        submitBtn.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      }
    }

    // --- 3. การส่งข้อมูลไปยัง Backend (Google Apps Script) ---
    function handleSubmit(e) {
      e.preventDefault();
      
      const hn = document.getElementById('hnInput').value.trim();
      const note = document.getElementById('noteInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      if (!hn) {
        alert('กรุณากรอก หรือ สแกนเลข HN');
        return;
      }

      // ปิดปุ่มระหว่างรอส่ง
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ กำลังส่งข้อมูล...";
      statusMsg.className = "mt-4 text-center text-blue-600 font-semibold";
      statusMsg.innerText = "กำลังบันทึกรูปภาพและข้อมูล...";

      const payload = {
        hn: hn,
        note: note,
        imageData: processedBase64Image
      };

      // ฟังก์ชันส่งไปหา Apps Script (ถ้าเขียนบน Apps Script ใช้ google.script.run)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .saveOrderData(payload);
      } else {
        // สำหรับทดสอบการทำงานบน Browser ทั่วไป
        console.log("Payload Ready:", payload);
        setTimeout(() => onSuccess({ success: true, message: "ทดสอบสำเร็จ (Demo Mode)" }), 1500);
      }
    }

    function onSuccess(response) {
      const statusMsg = document.getElementById('statusMsg');
      if(response.success) {
        statusMsg.className = "mt-4 text-center text-green-600 font-semibold";
        statusMsg.innerText = "✅ ส่ง Order เรียบร้อยแล้ว!";
        
        // Reset Form
        document.getElementById('orderForm').reset();
        clearImage();
      } else {
        onFailure(response.message);
      }
    }

    function onFailure(error) {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.className = "mt-4 text-center text-red-600 font-semibold";
      statusMsg.innerText = "❌ เกิดข้อผิดพลาด: " + error;
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = false;
      submitBtn.innerText = "🚀 ส่ง Order เข้าห้องผลิตยา";
    }
  </script>
</body>
</html>
