<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่ง Order ใบสั่งยา - OPD PED</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ZXing Library สำหรับแกะ Barcode -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    .thumb-grid img { transition: transform 0.2s ease; }
    .thumb-grid img:hover { transform: scale(1.03); }

    /* Overlay Mask สำหรับกล้องถ่ายภาพ */
    .camera-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* กรอบเล็งสติ๊กเกอร์ 3.5 x 8 cm (สัดส่วน 8 : 3.5) */
    .frame-sticker {
      width: 80%;
      max-width: 320px;
      aspect-ratio: 8 / 3.5;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      position: relative;
    }

    /* กรอบเล็ง A4 (สัดส่วน 1 : 1.414) */
    .frame-a4 {
      width: 70%;
      max-width: 280px;
      aspect-ratio: 1 / 1.414;
      border: 2px dashed #22c55e;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      border-radius: 6px;
      position: relative;
    }

    /* เส้นนำสายตาตรงกลางกรอบสติ๊กเกอร์ */
    .scan-line-red {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 2px;
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      transform: translateY(-50%);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-5">
    
    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold text-blue-600">OPD PED Order Sender</h1>
      <p class="text-xs text-slate-500 mt-1">ระบบถ่ายภาพและส่งใบสั่งยาเข้าห้องผลิตยา</p>
    </div>

    <form id="orderForm" onsubmit="handleSubmit(event)" class="space-y-5">
      
      <!-- 1. ส่วนถ่ายรูปสติ๊กเกอร์ / สแกน HN -->
      <div class="bg-blue-50/60 p-3.5 rounded-xl border border-blue-100">
        <label class="block text-sm font-semibold mb-1 text-blue-900">
          เลข HN คนไข้ <span class="text-red-500">*</span>
        </label>
        
        <div class="flex gap-2 mb-2">
          <input type="text" id="hnInput" required placeholder="กรอก หรือ ถ่ายรูปสติ๊กเกอร์" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-lg uppercase font-bold bg-white">
          
          <button type="button" onclick="openCustomCamera('sticker')" 
                  class="bg-blue-600 text-white px-3.5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition flex items-center gap-1.5 shrink-0 shadow-sm text-sm">
            📸 ถ่ายสติ๊กเกอร์
          </button>
        </div>

        <!-- กรอบแสดง Preview ภาพสติ๊กเกอร์ -->
        <div id="stickerPreviewContainer" class="hidden mt-2.5 p-2 bg-white rounded-lg border border-blue-200">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-semibold text-slate-600">🖼️ สติ๊กเกอร์ที่สแกน (3.5x8 cm):</span>
            <button type="button" onclick="clearStickerPreview()" class="text-xs text-red-500 hover:underline">✕ ล้างรูป</button>
          </div>
          <div class="relative flex justify-center bg-slate-100 rounded p-1">
            <img id="stickerPreviewImg" src="" class="max-h-24 object-contain rounded border border-slate-300 shadow-sm">
          </div>
        </div>

        <p id="barcodeStatus" class="text-xs text-slate-500 mt-2">📷 กดถ่ายสติ๊กเกอร์เพื่อเปิดกล้องพร้อมกรอบเล็ง 3.5x8 cm</p>
      </div>

      <!-- 2. Section ภาพ Protocol / เอกสารแนบ -->
      <div class="border-t pt-4">
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-sm font-semibold text-slate-700">1. ภาพ Protocol / เอกสารแนบ (ถ้ามี)</label>
          <span id="protocolCount" class="text-xs font-semibold text-slate-400">0 รูป</span>
        </div>
        
        <button type="button" onclick="openCustomCamera('protocol')" 
                class="w-full py-2.5 px-4 border-2 border-dashed border-slate-300 bg-slate-50 text-slate-600 rounded-lg font-medium hover:bg-slate-100 transition flex justify-center items-center gap-2 text-sm">
          📋 + ถ่ายภาพ Protocol (สแกนกรอบ A4)
        </button>

        <div id="protocolGrid" class="grid grid-cols-3 gap-2 mt-2.5 thumb-grid"></div>
      </div>

      <!-- 3. Section ภาพใบสั่งยา (Prescription Orders) -->
      <div class="border-t pt-4">
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-sm font-semibold text-slate-700">2. ถ่ายรูปใบสั่งยา <span class="text-red-500">*</span></label>
          <span id="prescriptionCount" class="text-xs font-semibold text-slate-400">0 รูป</span>
        </div>
        
        <button type="button" onclick="openCustomCamera('prescription')" 
                class="w-full py-3 px-4 border-2 border-dashed border-blue-400 bg-blue-50 text-blue-600 rounded-lg font-semibold hover:bg-blue-100 transition flex justify-center items-center gap-2 text-sm">
          📸 + ถ่ายภาพใบสั่งยา (สแกนกรอบ A4)
        </button>

        <div id="prescriptionGrid" class="grid grid-cols-3 gap-2 mt-2.5 thumb-grid"></div>
      </div>

      <!-- 4. หมายเหตุเพิ่มเติม -->
      <div class="border-t pt-4">
        <label class="block text-sm font-semibold mb-1 text-slate-700">หมายเหตุถึงเภสัชกร (ถ้ามี)</label>
        <textarea id="noteInput" rows="2" placeholder="เช่น STAT, ยาด่วน, เปลี่ยน dose..." 
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
      </div>

      <!-- 5. ปุ่มกดส่งข้อมูล -->
      <button type="submit" id="submitBtn" disabled 
              class="w-full bg-slate-300 text-slate-500 py-3 rounded-xl font-bold text-lg cursor-not-allowed transition shadow-none">
        🚀 ส่ง Order เข้าห้องผลิตยา
      </button>

    </form>

    <!-- Message แสดงสถานะ -->
    <div id="statusMsg" class="mt-4 text-center font-semibold text-sm"></div>

  </div>

  <!-- Modal กล้องถ่ายรูปพร้อม Overlay กรอบเล็ง -->
  <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col justify-between overflow-hidden">
    <!-- Camera Viewport -->
    <div class="relative flex-1 w-full h-full flex items-center justify-center overflow-hidden">
      <video id="webcamVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
      
      <!-- Overlay Frame (แสดงตามประเภทการถ่าย) -->
      <div class="camera-overlay">
        <!-- กรอบสติ๊กเกอร์ 3.5 x 8 cm -->
        <div id="stickerGuide" class="frame-sticker hidden">
          <div class="scan-line-red"></div>
        </div>
        
        <!-- กรอบ A4 -->
        <div id="a4Guide" class="frame-a4 hidden"></div>

        <p id="cameraGuideText" class="text-white text-xs mt-4 bg-black/50 px-3 py-1 rounded-full font-light">
          วางเอกสารให้อยู่ภายในกรอบ
        </p>
      </div>
    </div>

    <!-- Camera Controls -->
    <div class="bg-black/80 p-6 flex justify-around items-center z-20">
      <button type="button" onclick="closeCustomCamera()" class="text-white text-sm font-medium px-4 py-2 rounded-lg bg-slate-800">
        ✕ ยกเลิก
      </button>
      
      <!-- ปุ่มกดถ่ายภาพ -->
      <button type="button" onclick="capturePhoto()" class="w-16 h-16 rounded-full border-4 border-white bg-red-600 active:scale-95 transition shadow-lg"></button>
      
      <div class="w-12"></div> <!-- Spacer เพื่อความสมดุล -->
    </div>
  </div>

  <!-- Modal สำหรับกดขยายดูรูปภาพเต็มจอ -->
  <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4 backdrop-blur-sm" onclick="closeModal()">
    <div class="flex justify-between items-center text-white pt-2 px-2">
      <span id="modalTitle" class="text-sm font-medium">ตัวอย่างรูปภาพ</span>
      <button type="button" onclick="closeModal()" class="text-white bg-white/20 rounded-full w-8 h-8 flex items-center justify-center font-bold hover:bg-white/40">✕</button>
    </div>
    
    <div class="flex-1 flex items-center justify-center my-auto p-2 overflow-hidden">
      <img id="modalImg" src="" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl bg-white">
    </div>

    <div class="pb-4 text-center">
      <p class="text-xs text-slate-300 mb-2">แตะพื้นที่ว่างเพื่อปิดหน้าต่าง</p>
      <button type="button" id="modalDeleteBtn" class="bg-red-600 text-white px-5 py-2 rounded-lg font-semibold text-sm hover:bg-red-700 shadow-lg">
        🗑️ ลบรูปนี้
      </button>
    </div>
  </div>

  <canvas id="processCanvas" class="hidden"></canvas>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwPuk8-ush98U8MuBWTJTz5R8T6WBmrgzJxUpxA-ewdJ1Fr6Or-DnpaWgSaxj_gujr3Yg/exec";

    let protocolImages = [];
    let prescriptionImages = [];
    
    let currentCameraMode = null; // 'sticker', 'protocol', 'prescription'
    let mediaStream = null;

    let currentModalType = null;
    let currentModalIndex = null;

    // --- 1. ระบบเปิดกล้องพร้อมกรอบเล็ง Real-time ---
    async function openCustomCamera(mode) {
      currentCameraMode = mode;
      const modal = document.getElementById('cameraModal');
      const stickerGuide = document.getElementById('stickerGuide');
      const a4Guide = document.getElementById('a4Guide');
      const guideText = document.getElementById('cameraGuideText');

      // ปรับเปลี่ยนกรอบตามประเภท
      if (mode === 'sticker') {
        stickerGuide.classList.remove('hidden');
        a4Guide.classList.add('hidden');
        guideText.innerText = "จัดสติ๊กเกอร์ (3.5x8 cm) ให้อยู่ในกรอบสีฟ้า";
      } else {
        stickerGuide.classList.add('hidden');
        a4Guide.classList.remove('hidden');
        guideText.innerText = "จัดเอกสารให้อยู่ในกรอบ A4 สีเขียว";
      }

      try {
        // ขอสิทธิ์เปิดกล้องหลังมือถือ
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        }).catch(() => {
          // Fallback ถ้าเปิดกล้องหลังแบบ exact ไม่ได้
          return navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        });

        const video = document.getElementById('webcamVideo');
        video.srcObject = mediaStream;
        modal.classList.remove('hidden');
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์การใช้กล้องในเบราว์เซอร์: " + err);
      }
    }

    function closeCustomCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      document.getElementById('cameraModal').classList.add('hidden');
    }

    // --- 2. ถ่ายภาพและตัดเฉพาะเนื้อหาในกรอบเล็ง ---
    function capturePhoto() {
      const video = document.getElementById('webcamVideo');
      const canvas = document.getElementById('processCanvas');
      const ctx = canvas.getContext('2d');

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      if (currentCameraMode === 'sticker') {
        // ประมวลผลภาพสติ๊กเกอร์ (สัดส่วน 8 : 3.5)
        canvas.width = 800;
        canvas.height = 350;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // คำนวณตัดเฉพาะพื้นที่ตรงกลางที่แสดงในกรอบ
        const cropWidth = videoWidth * 0.80;
        const cropHeight = cropWidth / (8 / 3.5);
        const startX = (videoWidth - cropWidth) / 2;
        const startY = (videoHeight - cropHeight) / 2;

        ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);

        // ปรับภาพเป็น B/W High Contrast
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
          const val = avg < 130 ? 0 : 255;
          data[i] = val; data[i + 1] = val; data[i + 2] = val;
        }
        ctx.putImageData(imgData, 0, 0);

        const processedStickerBase64 = canvas.toDataURL('image/jpeg', 0.9);
        document.getElementById('stickerPreviewImg').src = processedStickerBase64;
        document.getElementById('stickerPreviewContainer').classList.remove('hidden');

        // สแกนบาร์โค้ด
        scanBarcodeFromImage(processedStickerBase64);

      } else {
        // ประมวลผลภาพ A4 (1200 x 1697 px)
        canvas.width = 1200;
        canvas.height = 1697;

        // เทสีขาวพื้นหลัง (ส่วนนอกกรอบจะเป็นสีขาว)
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let cropWidth, cropHeight;
        if (videoHeight / videoWidth > 1.414) {
          cropWidth = videoWidth * 0.70;
          cropHeight = cropWidth * 1.414;
        } else {
          cropHeight = videoHeight * 0.70;
          cropWidth = cropHeight / 1.414;
        }

        const startX = (videoWidth - cropWidth) / 2;
        const startY = (videoHeight - cropHeight) / 2;

        ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);

        // ปรับ Contrast ลบเงาพื้นหลัง
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
          let val = avg > 135 ? 255 : Math.max(0, avg * 0.65);
          data[i] = val; data[i + 1] = val; data[i + 2] = val;
        }
        ctx.putImageData(imgData, 0, 0);

        const processedBase64 = canvas.toDataURL('image/jpeg', 0.85);

        if (currentCameraMode === 'protocol') {
          protocolImages.push(processedBase64);
          renderThumbnails('protocol');
        } else {
          prescriptionImages.push(processedBase64);
          renderThumbnails('prescription');
        }
        checkFormStatus();
      }

      closeCustomCamera();
    }

    // --- 3. ถอดรหัส บาร์โค้ด ---
    function scanBarcodeFromImage(base64Image) {
      const statusEl = document.getElementById('barcodeStatus');
      statusEl.className = "text-xs text-blue-600 font-semibold animate-pulse";
      statusEl.innerText = "⏳ กำลังแกะรหัสบาร์โค้ด...";

      const img = new Image();
      img.onload = function() {
        const codeReader = new ZXing.BrowserMultiFormatReader();
        codeReader.decodeFromImageElement(img)
          .then(result => {
            if (result && result.text) {
              const cleanedHN = result.text.trim().toUpperCase();
              document.getElementById('hnInput').value = cleanedHN;
              statusEl.className = "text-xs text-green-600 font-bold";
              statusEl.innerText = "✅ อ่านบาร์โค้ดสำเร็จ: " + cleanedHN;
            } else {
              throw new Error("ไม่พบรหัส");
            }
          })
          .catch(() => {
            statusEl.className = "text-xs text-amber-600 font-semibold";
            statusEl.innerText = "⚠️ อ่านบาร์โค้ดไม่ออก (สามารถแก้ไข/พิมพ์เลข HN เองได้)";
          });
      };
      img.src = base64Image;
    }

    function clearStickerPreview() {
      document.getElementById('stickerPreviewContainer').classList.add('hidden');
      document.getElementById('stickerPreviewImg').src = "";
      document.getElementById('barcodeStatus').className = "text-xs text-slate-500 mt-2";
      document.getElementById('barcodeStatus').innerText = "📷 กดถ่ายสติ๊กเกอร์เพื่อเปิดกล้องพร้อมกรอบเล็ง 3.5x8 cm";
    }

    // --- 4. Render Thumbnails & Preview Lightbox ---
    function renderThumbnails(type) {
      const isProtocol = type === 'protocol';
      const images = isProtocol ? protocolImages : prescriptionImages;
      const grid = document.getElementById(isProtocol ? 'protocolGrid' : 'prescriptionGrid');
      const countEl = document.getElementById(isProtocol ? 'protocolCount' : 'prescriptionCount');
      
      countEl.innerText = `${images.length} รูป`;
      grid.innerHTML = "";

      images.forEach((imgBase64, index) => {
        const itemContainer = document.createElement('div');
        itemContainer.className = "relative border rounded-lg overflow-hidden bg-white aspect-[1/1.414] flex items-center justify-center cursor-pointer group shadow-sm border-slate-200";
        
        itemContainer.innerHTML = `
          <img src="${imgBase64}" class="w-full h-full object-cover" onclick="openModal('${type}', ${index})">
          <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded pointer-events-none">หน้า ${index + 1}</span>
          <button type="button" onclick="event.stopPropagation(); removeImage('${type}', ${index})" 
                  class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold hover:bg-red-600 shadow">
            ✕
          </button>
        `;
        grid.appendChild(itemContainer);
      });
    }

    function openModal(type, index) {
      currentModalType = type;
      currentModalIndex = index;

      const images = type === 'protocol' ? protocolImages : prescriptionImages;
      const title = (type === 'protocol' ? 'ภาพ Protocol' : 'ภาพใบสั่งยา') + ` (หน้า ${index + 1})`;

      document.getElementById('modalImg').src = images[index];
      document.getElementById('modalTitle').innerText = title;
      
      const deleteBtn = document.getElementById('modalDeleteBtn');
      deleteBtn.onclick = function() {
        removeImage(currentModalType, currentModalIndex);
        closeModal();
      };

      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      currentModalType = null;
      currentModalIndex = null;
    }

    function removeImage(type, index) {
      if (type === 'protocol') {
        protocolImages.splice(index, 1);
        renderThumbnails('protocol');
      } else {
        prescriptionImages.splice(index, 1);
        renderThumbnails('prescription');
      }
      checkFormStatus();
    }

    function checkFormStatus() {
      const submitBtn = document.getElementById('submitBtn');
      if (prescriptionImages.length > 0) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed', 'shadow-none');
        submitBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed', 'shadow-none');
        submitBtn.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      }
    }

    // --- 5. การส่งข้อมูลไปยัง Apps Script ---
    function handleSubmit(e) {
      e.preventDefault();
      
      const hn = document.getElementById('hnInput').value.trim().toUpperCase();
      const note = document.getElementById('noteInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      if (!hn) {
        alert('กรุณากรอก หรือ ถ่ายสติ๊กเกอร์สแกนเลข HN');
        return;
      }

      if (prescriptionImages.length === 0) {
        alert('กรุณารถ่ายภาพใบสั่งยาอย่างน้อย 1 หน้า');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ กำลังส่งข้อมูล...";
      statusMsg.className = "mt-4 text-center text-blue-600 font-semibold animate-pulse";
      statusMsg.innerText = "กำลังอัปโหลดเอกสารเข้าสู่ระบบ...";

      const payload = {
        hn: hn,
        note: note,
        protocolImages: protocolImages,
        prescriptionImages: prescriptionImages
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMsg.className = "mt-4 text-center text-green-600 font-semibold";
        statusMsg.innerText = "✅ ส่ง Order เรียบร้อยแล้ว!";
        
        document.getElementById('orderForm').reset();
        clearStickerPreview();
        
        protocolImages = [];
        prescriptionImages = [];
        renderThumbnails('protocol');
        renderThumbnails('prescription');
        checkFormStatus();
      })
      .catch(error => {
        statusMsg.className = "mt-4 text-center text-red-600 font-semibold";
        statusMsg.innerText = "❌ เกิดข้อผิดพลาดในการส่ง: " + error;
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 ส่ง Order เข้าห้องผลิตยา";
      });
    }
  </script>
</body>
</html>
