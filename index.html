<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่ง Order ใบสั่งยา - OPD PED</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 Qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* UI ตกแต่งกล้องและเส้นสแกนสีแดงแบบแอพธนาคาร */
    #reader-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 0.75rem;
      background-color: #000;
    }
    
    #reader { 
      width: 100%; 
    }
    
    #reader video { 
      object-fit: cover;
      border-radius: 0.75rem;
    }

    /* เส้นเลเซอร์สแกนสีแดงเรืองแสง */
    .scan-line {
      position: absolute;
      left: 5%;
      width: 90%;
      height: 3px;
      background-color: #ff0033;
      box-shadow: 0 0 8px #ff0033, 0 0 12px #ff0033;
      z-index: 10;
      pointer-events: none;
      animation: scanAnimation 2s infinite ease-in-out;
    }

    @keyframes scanAnimation {
      0% { top: 15%; opacity: 0.6; }
      50% { top: 80%; opacity: 1; }
      100% { top: 15%; opacity: 0.6; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">OPD PED Order Sender</h1>
      <p class="text-sm text-slate-500">ระบบถ่ายภาพและส่งใบสั่งยาเข้าห้องผลิตยา</p>
    </div>

    <form id="orderForm" onsubmit="handleSubmit(event)" class="space-y-5">
      
      <!-- 1. ส่วนบาร์โค้ด / เลข HN -->
      <div>
        <label class="block text-sm font-semibold mb-1">เลข HN คนไข้ <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <input type="text" id="hnInput" required placeholder="เช่น AB1234" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-lg uppercase">
          <button type="button" onclick="toggleScanner()" 
                  class="bg-blue-100 text-blue-700 px-3 py-2 rounded-lg font-semibold hover:bg-blue-200 transition flex items-center gap-1 shrink-0">
            📷 สแกน
          </button>
        </div>
        
        <!-- กล้องสแกนบาร์โค้ด + เส้นสีแดง -->
        <div id="scannerContainer" class="mt-2 hidden">
          <div id="reader-wrapper">
            <div class="scan-line"></div>
            <div id="reader"></div>
          </div>
          <p class="text-xs text-center text-slate-500 mt-1">วางบาร์โค้ด HN ให้อยู่ในกรอบเพื่อสแกน</p>
        </div>
      </div>

      <!-- 2. Section ภาพ Protocol (รองรับหลายหน้า) -->
      <div class="border-t pt-4">
        <label class="block text-sm font-semibold mb-1 text-slate-700">1. ภาพ Protocol / เอกสารแนบ (ถ้ามี)</label>
        
        <input type="file" id="protocolInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'protocol')">
        
        <button type="button" onclick="document.getElementById('protocolInput').click()" 
                class="w-full py-2.5 px-4 border-2 border-dashed border-slate-300 bg-slate-50 text-slate-600 rounded-lg font-medium hover:bg-slate-100 transition flex justify-center items-center gap-2 text-sm">
          📋 + ถ่ายภาพ Protocol (สแกนเพิ่มได้)
        </button>

        <!-- Preview Grid สำหรับ Protocol -->
        <div id="protocolGrid" class="grid grid-cols-3 gap-2 mt-2"></div>
      </div>

      <!-- 3. Section ภาพใบสั่งยา (รองรับหลายหน้า) -->
      <div class="border-t pt-4">
        <label class="block text-sm font-semibold mb-1 text-slate-700">2. ถ่ายรูปใบสั่งยา <span class="text-red-500">*</span></label>
        
        <input type="file" id="prescriptionInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'prescription')">
        
        <button type="button" onclick="document.getElementById('prescriptionInput').click()" 
                class="w-full py-3 px-4 border-2 border-dashed border-blue-400 bg-blue-50 text-blue-600 rounded-lg font-semibold hover:bg-blue-100 transition flex justify-center items-center gap-2">
          📸 + ถ่ายภาพใบสั่งยา (สแกนเพิ่มได้)
        </button>

        <!-- Preview Grid สำหรับ ใบสั่งยา -->
        <div id="prescriptionGrid" class="grid grid-cols-3 gap-2 mt-2"></div>
      </div>

      <!-- Canvas ซ่อนไว้ใช้ประมวลผลรูปภาพ (B/W + Contrast) -->
      <canvas id="processCanvas" class="hidden"></canvas>

      <!-- 4. หมายเหตุเพิ่มเติม -->
      <div class="border-t pt-4">
        <label class="block text-sm font-semibold mb-1">หมายเหตุถึงเภสัชกร (ถ้ามี)</label>
        <textarea id="noteInput" rows="2" placeholder="เช่น STAT, ยาด่วน, เปลี่ยน dose..." 
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
      </div>

      <!-- 5. ปุ่มกดส่งข้อมูล -->
      <button type="submit" id="submitBtn" disabled 
              class="w-full bg-slate-300 text-slate-500 py-3 rounded-lg font-bold text-lg cursor-not-allowed transition">
        🚀 ส่ง Order เข้าห้องผลิตยา
      </button>

    </form>

    <!-- Message แสดงสถานะ -->
    <div id="statusMsg" class="mt-4 text-center font-semibold text-sm"></div>

  </div>

  <script>
    let html5QrcodeScanner = null;
    
    // Arrays สำหรับเก็บ Base64 ของรูปภาพแต่ละประเภท
    let protocolImages = [];
    let prescriptionImages = [];

    // --- 1. ระบบสแกน Barcode (พร้อม Laser Red Line & Formats) ---
    function toggleScanner() {
      const container = document.getElementById('scannerContainer');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { 
          fps: 15, 
          qrbox: { width: 260, height: 140 },
          // ปรับปรุงการสแกนรหัสบาร์โค้ดโรงพยาบาล (Code128, Code39)
          formatsToSupport: [ 
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13
          ]
        };

        html5QrcodeScanner.start(
          { facingMode: "environment" }, 
          config,
          (decodedText) => {
            // ทำการแปลงเป็นตัวพิมพ์ใหญ่ และทำความสะอาดข้อมูล
            document.getElementById('hnInput').value = decodedText.trim().toUpperCase();
            stopScanner();
          },
          (errorMessage) => { /* Ignore minor scanning errors */ }
        ).catch(err => {
          alert('ไม่สามารถเปิดกล้องได้: ' + err);
          stopScanner();
        });
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scannerContainer').classList.add('hidden');
          html5QrcodeScanner = null;
        }).catch(() => {
          document.getElementById('scannerContainer').classList.add('hidden');
          html5QrcodeScanner = null;
        });
      } else {
        document.getElementById('scannerContainer').classList.add('hidden');
      }
    }

    // --- 2. ระบบจัดการภาพถ่าย (ประมวลผล + รองรับหลายหน้า) ---
    function handleImageUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('processCanvas');
          const ctx = canvas.getContext('2d');

          // ย่อขนาดภาพให้คมชัด ไม่เปลืองพื้นที่ (Max Width 1600px)
          const maxWidth = 1600;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // ปรับภาพขาวดำ + High Contrast
          const imgData = ctx.getImageData(0, 0, width, height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            let val = avg;
            if (val > 140) {
              val = Math.min(255, val * 1.15); // เร่งพื้นหลังขาว
            } else {
              val = Math.max(0, val * 0.75);  // เร่งรอยหมึกดำ
            }
            data[i] = val;
            data[i + 1] = val;
            data[i + 2] = val;
          }

          ctx.putImageData(imgData, 0, 0);
          const processedBase64 = canvas.toDataURL('image/jpeg', 0.85);

          // บันทึกลง Array ตามประเภท
          if (type === 'protocol') {
            protocolImages.push(processedBase64);
            renderThumbnails('protocol');
          } else if (type === 'prescription') {
            prescriptionImages.push(processedBase64);
            renderThumbnails('prescription');
          }

          // เคลียร์ค่า input file เพื่อให้ถ่ายรูปซ้ำได้
          event.target.value = "";
          checkFormStatus();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // แสดงผลรูปย่อ Grid
    function renderThumbnails(type) {
      const isProtocol = type === 'protocol';
      const images = isProtocol ? protocolImages : prescriptionImages;
      const grid = document.getElementById(isProtocol ? 'protocolGrid' : 'prescriptionGrid');
      
      grid.innerHTML = "";

      images.forEach((imgBase64, index) => {
        const itemContainer = document.createElement('div');
        itemContainer.className = "relative border rounded-lg overflow-hidden bg-slate-100 aspect-square flex items-center justify-center";
        
        itemContainer.innerHTML = `
          <img src="${imgBase64}" class="w-full h-full object-cover">
          <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">หน้า ${index + 1}</span>
          <button type="button" onclick="removeImage('${type}', ${index})" 
                  class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold hover:bg-red-600 shadow">
            ✕
          </button>
        `;
        grid.appendChild(itemContainer);
      });
    }

    // ลบรูปภาพที่เลือก
    function removeImage(type, index) {
      if (type === 'protocol') {
        protocolImages.splice(index, 1);
        renderThumbnails('protocol');
      } else {
        prescriptionImages.splice(index, 1);
        renderThumbnails('prescription');
      }
      checkFormStatus();
    }

    // ตรวจสอบสถานะการกดส่ง (ต้องมีรูปใบสั่งยาอย่างน้อย 1 ใบ)
    function checkFormStatus() {
      const submitBtn = document.getElementById('submitBtn');
      if (prescriptionImages.length > 0) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        submitBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        submitBtn.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-md');
      }
    }

    // --- 3. การส่งข้อมูลไปยัง Backend ---
    function handleSubmit(e) {
      e.preventDefault();
      
      const hn = document.getElementById('hnInput').value.trim().toUpperCase();
      const note = document.getElementById('noteInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      if (!hn) {
        alert('กรุณากรอก หรือ สแกนเลข HN');
        return;
      }

      if (prescriptionImages.length === 0) {
        alert('กรุณารถ่ายภาพใบสั่งยาอย่างน้อย 1 หน้า');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ กำลังส่งข้อมูล...";
      statusMsg.className = "mt-4 text-center text-blue-600 font-semibold";
      statusMsg.innerText = "กำลังอัปโหลดเอกสารเข้าระบบ...";

      // Payload รวมภาพแบบ Array
      const payload = {
        hn: hn,
        note: note,
        protocolImages: protocolImages,        // Array of Base64 strings
        prescriptionImages: prescriptionImages  // Array of Base64 strings
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .saveOrderData(payload);
      } else {
        console.log("Payload Ready:", payload);
        setTimeout(() => onSuccess({ success: true, message: "ทดสอบสำเร็จ (Demo Mode)" }), 1500);
      }
    }

    function onSuccess(response) {
      const statusMsg = document.getElementById('statusMsg');
      if(response.success) {
        statusMsg.className = "mt-4 text-center text-green-600 font-semibold";
        statusMsg.innerText = "✅ ส่ง Order เรียบร้อยแล้ว!";
        
        // Reset Form & Clear Memory
        document.getElementById('orderForm').reset();
        protocolImages = [];
        prescriptionImages = [];
        renderThumbnails('protocol');
        renderThumbnails('prescription');
        checkFormStatus();
      } else {
        onFailure(response.message);
      }
    }

    function onFailure(error) {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.className = "mt-4 text-center text-red-600 font-semibold";
      statusMsg.innerText = "❌ เกิดข้อผิดพลาด: " + error;
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = false;
      submitBtn.innerText = "🚀 ส่ง Order เข้าห้องผลิตยา";
    }
  </script>
</body>
</html>
